[project]
name = "dense-1b"
version = "0.1.0"
description = "dense-1b"
readme = "README.md"
authors = [
    { name = "naixxxxx", email = "2361119782@qq.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "flash-linear-attention[cuda]==0.5.2",
    "numpy>=2.5.3",
    "pyarrow>=25.0.1",
    "torch==2.10.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
    "wandb>=0.30.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
